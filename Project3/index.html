<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign-Up</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="left_container">
            <h1 id="Name">Jaan's Cafe</h1>
            <p id="Trademark">Copyright Reserved</p>
        </div>
        <div class="right_container">
            <h1>Sign Up Here</h1>
            <pre id="Account">Already have an account? <a href="login.html">Login here</a></pre>
            <form action="something.js" method="post">
                <label for="username">Username</label><br>
                <input type="text" id="username" name="username" required placeholder="John"><br>
                <label for="email">Email</label><br>
                <input type="email" id="email" name="email" required placeholder="john@doe"><br>
                <label for="password">Password</label><br>
                <input type="password" id="password" name="password" required placeholder="Password"><br>
                <label for="confirm_password">Confirm Password</label><br>
                <input type="password" id="confirm_password" name="confirm_password" required placeholder="Confirm Password"><br>
                <label for="phone">Phone Number</label><br>
                <input type="tel" id="phone" name="phone" required placeholder="123 456 7890"><br>
                <hr>
                <button type="submit" id="Submit">Sign Up</button>
            </form>
        </div>
    </div>
</body>
</html>
